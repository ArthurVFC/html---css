    <title>Pseudo-classes</title>
    <style>
    div {
    display: inline-block;
    background-color:lightgray;
    border: 1px solid Oblack;
    text-align: center;
    height: 200px;
    width: 200px;
    }
    /*HOVER: quando tocar na div ela vai fazer uma interação*/
    div:hover {
    background-color: yellow;
    }



    /*PARTE DO TEXTO ESCONDIDO*/
    body {
    font-family: Arial, Helvetica, sans-serif;
    }
    div > p {
    display: none;
    }
    div:hover > p {
    display: block;
    color: white;
    background-color: red;
    width: 300px;
    }
    
    div:hover {
    color:red;
    }
    </style>
